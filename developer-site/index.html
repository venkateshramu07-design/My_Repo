<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plainly by Blog Digest</title>
<meta name="description" content="Plainly: Money, Mind & Work. Clear guides, handy tools and daily puzzles, from Blog Digest.">
<style>
:root{--bg:#f7f4ee;--ink:#15171d;--muted:#5d6271;--card:#fff;--accent:#e9844a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--ink:#ecebe7;--muted:#a4a8b3;--card:#161920}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 20px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 34px Georgia,serif}
h1{font:700 34px/1.15 Georgia,serif;margin:22px 0 8px}p{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-top:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;margin:6px 8px 0 0}
ul{padding-left:20px;margin:0}li{margin:6px 0}a{color:var(--accent)}
footer{color:var(--muted);font-size:14px;margin-top:36px}
</style>
</head>
<body><main>
<div class="logo">P</div>
<h1>Plainly: Money, Mind &amp; Work</h1>
<p>Your money score, a plan made for you, 72 handy tools and a friendly community. Plainly is the Android app of <a href="https://randomthoughtsever.blogspot.com/">Blog Digest</a>.</p>
<a class="btn" href="https://play.google.com/store/apps/details?id=com.randomthoughtsever.plainly">Get it on Google Play</a>
<a class="btn" href="https://randomthoughtsever.blogspot.com/" style="background:transparent;color:var(--accent);border:2px solid var(--accent)">Read the blog</a>
<div class="card">
<ul>
<li><a href="https://randomthoughtsever.blogspot.com/2021/06/privacy-policy.html">Privacy policy</a></li>
<li><a href="https://randomthoughtsever.blogspot.com/2021/06/terms-and-conditions.html">Terms and conditions</a></li>
<li><a href="https://randomthoughtsever.blogspot.com/2021/06/contact-us.html">Contact</a></li>
</ul>
</div>
<footer>© Blog Digest</footer>
</main></body>
</html>
