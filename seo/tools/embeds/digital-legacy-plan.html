<figure class="bd-dleg" aria-label="A digital legacy plan: four steps that let your family reach your accounts, money and crypto after you die">
<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Four steps to a digital legacy plan</title>
<style>
.bd-dleg{margin:2em 0!important}
.bd-dleg svg{display:block;width:100%;height:auto;border-radius:20px}
.lg-bg{fill:#f6f3fb}
.lg-box{fill:#fff;stroke:#7a5af5;stroke-width:2}
.lg-fam{fill:#fff;stroke:#0f9d76;stroke-width:2.5}
.lg-t{font:700 17px Georgia,serif;fill:#15171d}
.lg-h{font:700 14px system-ui,-apple-system,sans-serif;fill:#15171d}
.lg-s{font:500 12.5px system-ui,-apple-system,sans-serif;fill:#5d6271}
.lg-n{font:800 13px system-ui,-apple-system,sans-serif;fill:#fff}
.lg-ln{fill:none;stroke:#7a5af5;stroke-opacity:.35;stroke-width:2;stroke-dasharray:5 6}
.lg-k{fill:#f2a33a}
.lg-step{opacity:0;animation:lg-in .6s ease-out forwards}
.lg-d1{animation-delay:.2s}.lg-d2{animation-delay:.6s}.lg-d3{animation-delay:1s}.lg-d4{animation-delay:1.4s}.lg-d5{animation-delay:1.9s}
@keyframes lg-in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bd-dleg animateMotion{display:none}.lg-step{animation:none;opacity:1}}
</style>
<rect class="lg-bg" width="640" height="360" rx="20"/>
<text class="lg-t" x="24" y="36">Four steps so your family can find and open everything</text>
<g class="lg-step lg-d1"><rect class="lg-box" x="20" y="60" width="290" height="58" rx="12"/><circle cx="44" cy="89" r="12" fill="#7a5af5"/><text class="lg-n" x="44" y="94" text-anchor="middle">1</text><text class="lg-h" x="66" y="85">List every account and asset</text><text class="lg-s" x="66" y="104">Banks, crypto, email, photos, domains</text></g>
<g class="lg-step lg-d2"><rect class="lg-box" x="20" y="130" width="290" height="58" rx="12"/><circle cx="44" cy="159" r="12" fill="#7a5af5"/><text class="lg-n" x="44" y="164" text-anchor="middle">2</text><text class="lg-h" x="66" y="155">Set up emergency access</text><text class="lg-s" x="66" y="174">In a password manager, for someone you trust</text></g>
<g class="lg-step lg-d3"><rect class="lg-box" x="20" y="200" width="290" height="58" rx="12"/><circle cx="44" cy="229" r="12" fill="#7a5af5"/><text class="lg-n" x="44" y="234" text-anchor="middle">3</text><text class="lg-h" x="66" y="225">Legacy contacts and a crypto plan</text><text class="lg-s" x="66" y="244">Apple, Google, Facebook; crypto keys</text></g>
<g class="lg-step lg-d4"><rect class="lg-box" x="20" y="270" width="290" height="58" rx="12"/><circle cx="44" cy="299" r="12" fill="#7a5af5"/><text class="lg-n" x="44" y="304" text-anchor="middle">4</text><text class="lg-h" x="66" y="295">Mention digital assets in your will</text><text class="lg-s" x="66" y="314">Name who handles them; give consent</text></g>
<path id="lg-p1" class="lg-ln" d="M310 89 C 380 89, 400 170, 440 190"/>
<path id="lg-p2" class="lg-ln" d="M310 159 C 370 159, 400 185, 440 195"/>
<path id="lg-p3" class="lg-ln" d="M310 229 C 370 229, 400 205, 440 200"/>
<path id="lg-p4" class="lg-ln" d="M310 299 C 380 299, 400 220, 440 205"/>
<g class="lg-step lg-d5"><rect class="lg-fam" x="440" y="140" width="180" height="120" rx="16"/>
<text class="lg-h" x="530" y="182" text-anchor="middle">Your family</text>
<text class="lg-s" x="530" y="204" text-anchor="middle">finds the money,</text>
<text class="lg-s" x="530" y="222" text-anchor="middle">keeps the memories,</text>
<text class="lg-s" x="530" y="240" text-anchor="middle">doesn't lose the crypto</text></g>
<rect class="lg-k" x="-6" y="-6" width="12" height="12" rx="3"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#lg-p1"/></animateMotion></rect>
<rect class="lg-k" x="-6" y="-6" width="12" height="12" rx="3"><animateMotion dur="2.8s" begin=".7s" repeatCount="indefinite"><mpath href="#lg-p2"/></animateMotion></rect>
<rect class="lg-k" x="-6" y="-6" width="12" height="12" rx="3"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#lg-p3"/></animateMotion></rect>
<rect class="lg-k" x="-6" y="-6" width="12" height="12" rx="3"><animateMotion dur="2.8s" begin="2.1s" repeatCount="indefinite"><mpath href="#lg-p4"/></animateMotion></rect>
</svg>
<figcaption style="font:500 13.5px/1.5 system-ui,sans-serif;color:#5d6271;margin-top:8px">Never write passwords or seed phrases in the will itself: wills can become public documents. Keep access details in a password manager or a sealed letter stored separately.</figcaption>
</figure>
