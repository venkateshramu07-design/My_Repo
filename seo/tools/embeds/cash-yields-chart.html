<figure class="bd-cashy" aria-label="What $10,000 of cash earns in a year in different US accounts, October 2026">
<style>
.bd-cashy{margin:2em 0!important;padding:20px;border-radius:20px;background:#f1f8f5;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.bd-cashy .cy-h{margin:0 0 4px;font:800 19px Georgia,serif;color:#15171d!important}
.bd-cashy .cy-s{margin:0 0 16px;font-size:13.5px;color:#5d6271!important}
.bd-cashy .cy-row{display:grid;grid-template-columns:190px 1fr 58px;gap:12px;align-items:center;margin:11px 0}
.bd-cashy .cy-row b{font-size:14px;color:#15171d!important}
.bd-cashy .cy-row small{display:block;font-size:11.5px;color:#5d6271!important;font-weight:500}
.bd-cashy .cy-track{height:18px;border-radius:999px;background:rgba(0,0,0,.07)!important;overflow:hidden;position:relative}
.bd-cashy .cy-fill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;width:0;background:#0f9d76!important;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bd-cashy .cy-low .cy-fill{background:#94a3b8!important}
.bd-cashy.cy-on .cy-fill{width:var(--w)}
.bd-cashy .cy-v{font:700 14px system-ui,sans-serif;color:#15171d!important;text-align:right}
.bd-cashy figcaption{margin-top:12px;font-size:12.5px;color:#5d6271!important}
@media (max-width:560px){.bd-cashy .cy-row{grid-template-columns:1fr 58px;gap:6px 10px;margin:14px 0}.bd-cashy .cy-row>span:first-child{grid-column:1/-1}.bd-cashy .cy-row small{display:inline;margin-left:6px}}
@media (prefers-reduced-motion:reduce){.bd-cashy .cy-fill{transition:none}}
</style>
<p class="cy-h">Same $10,000, very different results</p>
<p class="cy-s">Interest earned in a year at typical US rates in October 2026, before tax.</p>
<div class="cy-row cy-low"><span><b>Typical savings account</b><small>national average about 0.4%</small></span><span class="cy-track"><i class="cy-fill" style="--w:9%"></i></span><span class="cy-v">$40</span></div>
<div class="cy-row"><span><b>Money market fund</b><small>government fund, about 3.9%</small></span><span class="cy-track"><i class="cy-fill" style="--w:87%"></i></span><span class="cy-v">$390</span></div>
<div class="cy-row"><span><b>Treasury bills</b><small>3-month bills, about 4.0%</small></span><span class="cy-track"><i class="cy-fill" style="--w:89%"></i></span><span class="cy-v">$400</span></div>
<div class="cy-row"><span><b>High-yield savings account</b><small>top easy-access, about 4.2%</small></span><span class="cy-track"><i class="cy-fill" style="--w:93%"></i></span><span class="cy-v">$420</span></div>
<div class="cy-row"><span><b>I bonds</b><small>4.26% until 31 Oct, locked 1 year</small></span><span class="cy-track"><i class="cy-fill" style="--w:95%"></i></span><span class="cy-v">$426</span></div>
<div class="cy-row"><span><b>1-year certificate of deposit</b><small>top offers about 4.4%</small></span><span class="cy-track"><i class="cy-fill" style="--w:98%"></i></span><span class="cy-v">$440</span></div>
<figcaption>Rounded figures from FDIC data, Bankrate, NerdWallet, TreasuryDirect and fund providers in October 2026. Rates change often and best-buy offers may need conditions; Treasury and I bond interest is free of US state income tax.</figcaption>
<script>
(function(){var f=document.currentScript&&document.currentScript.closest('.bd-cashy');if(!f)return;
if(!('IntersectionObserver' in window)){f.classList.add('cy-on');return;}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){f.classList.add('cy-on');io.disconnect();}})},{threshold:.3});io.observe(f);})();
</script>
</figure>
