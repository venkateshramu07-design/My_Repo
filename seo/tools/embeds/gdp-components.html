<figure class="bd-gdpmix" aria-label="Approximate shares of India's GDP by type of spending">
<style>
.bd-gdpmix{margin:2em 0!important;padding:20px;border-radius:20px;background:color-mix(in srgb,#7c5cff 6%,#fff);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.bd-gdpmix .gm-h{margin:0 0 4px;font:800 19px Georgia,serif;color:#15171d}
.bd-gdpmix .gm-s{margin:0 0 16px;font-size:13.5px;color:#5d6271}
.bd-gdpmix .gm-row{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center;margin:10px 0}
.bd-gdpmix .gm-row b{font-size:14px;color:#15171d}.bd-gdpmix .gm-row small{display:block;font-size:11.5px;color:#5d6271;font-weight:500}
.bd-gdpmix .gm-track{height:16px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden;position:relative}
.bd-gdpmix .gm-fill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;width:0;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bd-gdpmix.gm-on .gm-fill{width:var(--w)}
.bd-gdpmix .gm-neg .gm-fill{left:auto;right:0;background:#94a3b8}
.bd-gdpmix .gm-v{font:700 14px system-ui,sans-serif;color:#15171d;text-align:right}
.bd-gdpmix figcaption{margin-top:12px;font-size:12.5px;color:#5d6271}
@media (max-width:520px){.bd-gdpmix .gm-row{grid-template-columns:104px 1fr 42px;gap:8px}}
@media (prefers-reduced-motion:reduce){.bd-gdpmix .gm-fill{transition:none}}
</style>
<p class="gm-h">Where India's GDP comes from</p>
<p class="gm-s">GDP = C + I + G + (X − M). Rough shares of GDP at current prices in recent years.</p>
<div class="gm-row"><span><b>Consumption (C)</b><small>household spending</small></span><span class="gm-track"><i class="gm-fill" style="--w:60%;background:#e2462c"></i></span><span class="gm-v">~60%</span></div>
<div class="gm-row"><span><b>Investment (I)</b><small>buildings, machines, homes</small></span><span class="gm-track"><i class="gm-fill" style="--w:33%;background:#0f9d76"></i></span><span class="gm-v">~33%</span></div>
<div class="gm-row"><span><b>Government (G)</b><small>salaries, services bought</small></span><span class="gm-track"><i class="gm-fill" style="--w:10%;background:#7c5cff"></i></span><span class="gm-v">~10%</span></div>
<div class="gm-row gm-neg"><span><b>Net exports (X − M)</b><small>imports exceed exports</small></span><span class="gm-track"><i class="gm-fill" style="--w:3%"></i></span><span class="gm-v">~−3%</span></div>
<figcaption>Shares are rounded and vary from year to year; changes in stocks, valuables and statistical discrepancies are left out. Source for exact figures: MoSPI national accounts.</figcaption>
<script>
(function(){var f=document.currentScript&&document.currentScript.closest('.bd-gdpmix');if(!f)return;
if(!('IntersectionObserver' in window)){f.classList.add('gm-on');return;}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){f.classList.add('gm-on');io.disconnect();}})},{threshold:.3});io.observe(f);})();
</script>
</figure>
