<div class="bd-calc" id="bd-fx">
<p class="bc-title">Currency converter</p>
<p class="bc-sub">Live reference rates published by the European Central Bank, updated each working day.</p>
<div class="bc-grid">
<div><label for="fx-amt">Amount</label><input id="fx-amt" type="number" min="0" step="1" value="100"></div>
<div><label for="fx-from">From</label><select id="fx-from"><option>USD</option></select></div>
<div><label for="fx-to">To</label><select id="fx-to"><option>INR</option></select></div>
</div>
<div class="bc-row"><button type="button" id="fx-swap">⇄ Swap</button></div>
<div class="bc-out">
<div class="bc-stat bc-main"><span id="fx-l">Converted amount</span><b id="fx-res">Loading…</b></div>
<div class="bc-stat"><span>Exchange rate</span><b id="fx-rate">—</b></div>
<div class="bc-stat"><span>1-year change</span><b id="fx-chg">—</b></div>
</div>
<p class="bc-note" id="fx-note">Rates are mid-market reference rates. Banks and money changers add a margin, so the rate you get will be a little worse.</p>
</div>
<script>
(function(){
var root=document.getElementById('bd-fx');if(!root||!window.bdCalc||!window.fetch)return;var C=window.bdCalc;
function $(id){return document.getElementById(id)}
$('fx-swap').textContent='⇄ Swap';
var API='https://api.frankfurter.dev/v1/',names={},cache={};
function fill(sel,val){sel.innerHTML='';Object.keys(names).sort().forEach(function(c){sel.add(new Option(c+' – '+names[c],c))});sel.value=val}
function get(url){if(!cache[url])cache[url]=fetch(API+url).then(function(r){if(!r.ok)throw 0;return r.json()});return cache[url]}
function ago(){var d=new Date();d.setFullYear(d.getFullYear()-1);return d.toISOString().slice(0,10)}
function run(){
  var a=C.num($('fx-amt')),f=$('fx-from').value,t=$('fx-to').value;
  if(f===t){$('fx-res').textContent=a.toLocaleString()+' '+t;$('fx-rate').textContent='1 '+f+' = 1 '+t;$('fx-chg').textContent='0%';return}
  Promise.all([get('latest?base='+f+'&symbols='+t),get(ago()+'?base='+f+'&symbols='+t)]).then(function(r){
    var now=r[0].rates[t],then=r[1].rates[t];
    $('fx-res').textContent=(a*now).toLocaleString(t==='INR'?'en-IN':'en-US',{maximumFractionDigits:2})+' '+t;
    $('fx-rate').textContent='1 '+f+' = '+now.toLocaleString('en-US',{maximumFractionDigits:4})+' '+t;
    var ch=(now/then-1)*100;$('fx-chg').textContent=(ch>0?'+':'')+ch.toFixed(1)+'% ('+f+(ch>=0?' stronger':' weaker')+')';
    $('fx-l').textContent=a.toLocaleString()+' '+f+' is';
    $('fx-note').textContent='Rates as of '+r[0].date+'. These are mid-market reference rates; banks and money changers add a margin, so the rate you get will be a little worse.';
  }).catch(function(){$('fx-res').textContent='Rates unavailable';$('fx-note').textContent='Couldn’t load live rates right now. Please try again later.'});
}
get('currencies').then(function(n){names=n;fill($('fx-from'),'USD');fill($('fx-to'),'INR');C.bind(root,run)}).catch(function(){$('fx-res').textContent='Rates unavailable'});
$('fx-swap').addEventListener('click',function(){var f=$('fx-from').value;$('fx-from').value=$('fx-to').value;$('fx-to').value=f;run()});
})();
</script>
