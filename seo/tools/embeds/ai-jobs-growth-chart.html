<figure class="bd-aijobs" aria-label="Growth in US job postings for skilled trades and AI-infrastructure roles, March 2026">
<style>
.bd-aijobs{margin:2em 0!important;padding:20px;border-radius:20px;background:#f3f6fb;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.bd-aijobs .aj-h{margin:0 0 4px;font:800 19px Georgia,serif;color:#15171d!important}
.bd-aijobs .aj-s{margin:0 0 16px;font-size:13.5px;color:#5d6271!important}
.bd-aijobs .aj-row{display:grid;grid-template-columns:200px 1fr 58px;gap:12px;align-items:center;margin:11px 0}
.bd-aijobs .aj-row b{font-size:14px;color:#15171d!important}
.bd-aijobs .aj-track{height:18px;border-radius:999px;background:rgba(0,0,0,.07)!important;overflow:hidden;position:relative}
.bd-aijobs .aj-fill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;width:0;background:#0f9d76!important;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bd-aijobs .aj-trade .aj-fill{background:#2f7de1!important}
.bd-aijobs.aj-on .aj-fill{width:var(--w)}
.bd-aijobs .aj-v{font:700 14px system-ui,sans-serif;color:#15171d!important;text-align:right}
.bd-aijobs .aj-key{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:#3c404b!important}
.bd-aijobs .aj-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bd-aijobs figcaption{margin-top:12px;font-size:12.5px;color:#5d6271!important}
@media (max-width:560px){.bd-aijobs .aj-row{grid-template-columns:1fr 58px;gap:6px 10px;margin:14px 0}.bd-aijobs .aj-row>span:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.bd-aijobs .aj-fill{transition:none}}
</style>
<p class="aj-h">Where AI is creating demand</p>
<p class="aj-s">Growth in US job postings, analysis published March 2026.</p>
<div class="aj-row"><span><b>Robotics technicians</b></span><span class="aj-track"><i class="aj-fill" style="--w:100%"></i></span><span class="aj-v">+107%</span></div>
<div class="aj-row"><span><b>HVAC engineers</b></span><span class="aj-track"><i class="aj-fill" style="--w:63%"></i></span><span class="aj-v">+67%</span></div>
<div class="aj-row"><span><b>Industrial automation technicians</b></span><span class="aj-track"><i class="aj-fill" style="--w:48%"></i></span><span class="aj-v">+51%</span></div>
<div class="aj-row aj-trade"><span><b>Construction workers</b></span><span class="aj-track"><i class="aj-fill" style="--w:28%"></i></span><span class="aj-v">+30%</span></div>
<div class="aj-row aj-trade"><span><b>Welders</b></span><span class="aj-track"><i class="aj-fill" style="--w:23%"></i></span><span class="aj-v">+25%</span></div>
<div class="aj-row aj-trade"><span><b>Electricians</b></span><span class="aj-track"><i class="aj-fill" style="--w:17%"></i></span><span class="aj-v">+18%</span></div>
<div class="aj-key"><span><i style="background:#0f9d76"></i>AI-infrastructure roles</span><span><i style="background:#2f7de1"></i>Skilled trades</span></div>
<figcaption>Source: Randstad analysis of US job postings, March 2026. The same analysis found demand for skilled trades growing about three times as fast as for desk-based professional roles. Much of the demand comes from building and running data centres.</figcaption>
<script>
(function(){var f=document.currentScript&&document.currentScript.closest('.bd-aijobs');if(!f)return;
if(!('IntersectionObserver' in window)){f.classList.add('aj-on');return;}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){f.classList.add('aj-on');io.disconnect();}})},{threshold:.3});io.observe(f);})();
</script>
</figure>
