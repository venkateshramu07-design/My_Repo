<figure class="bd-cpaths" aria-label="One person's credit history reaches three credit bureaus, and different scoring models turn those files into different scores">
<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why one person has many credit scores</title>
<style>
.bd-cpaths{margin:2em 0!important}
.bd-cpaths svg{display:block;width:100%;height:auto;border-radius:20px}
.cp-bg{fill:#f3f5fb}
.cp-box{fill:#fff;stroke:#2f7de1;stroke-width:2}
.cp-bur{fill:#fff;stroke:#7a5af5;stroke-width:2}
.cp-chip{fill:#fff;stroke:#0f9d76;stroke-width:2}
.cp-chipm{fill:#fff;stroke:#e2462c;stroke-width:2}
.cp-t{font:700 17px Georgia,serif;fill:#15171d}
.cp-h{font:700 15px system-ui,-apple-system,sans-serif;fill:#15171d}
.cp-s{font:500 13px system-ui,-apple-system,sans-serif;fill:#5d6271}
.cp-c{font:600 12.5px system-ui,-apple-system,sans-serif;fill:#3d4252}
.cp-n{font:800 18px system-ui,-apple-system,sans-serif;fill:#0b7c5c}
.cp-nm{font:800 18px system-ui,-apple-system,sans-serif;fill:#c23a22}
.cp-ln{fill:none;stroke:#7a5af5;stroke-opacity:.35;stroke-width:2;stroke-dasharray:5 6}
.cp-dot{fill:#2f7de1}.cp-dot2{fill:#7a5af5}
.cp-chip,.cp-chipm{opacity:0;animation:cp-in .6s ease-out forwards}
.cp-g1{animation-delay:.4s}.cp-g2{animation-delay:.8s}.cp-g3{animation-delay:1.2s}.cp-g4{animation-delay:1.6s}
.cp-gt{opacity:0;animation:cp-in .6s ease-out forwards}
@keyframes cp-in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bd-cpaths animateMotion{display:none}.cp-chip,.cp-chipm,.cp-gt{animation:none;opacity:1}}
</style>
<rect class="cp-bg" width="640" height="350" rx="20"/>
<text class="cp-t" x="24" y="36">One credit history, many credit scores</text>
<rect class="cp-box" x="20" y="125" width="138" height="100" rx="14"/>
<text class="cp-h" x="89" y="160" text-anchor="middle">Your lenders</text>
<text class="cp-s" x="89" y="182" text-anchor="middle">report balances,</text>
<text class="cp-s" x="89" y="200" text-anchor="middle">limits, payments</text>
<rect class="cp-bur" x="214" y="72" width="140" height="52" rx="12"/><text class="cp-h" x="284" y="104" text-anchor="middle">Equifax file</text>
<rect class="cp-bur" x="214" y="149" width="140" height="52" rx="12"/><text class="cp-h" x="284" y="181" text-anchor="middle">Experian file</text>
<rect class="cp-bur" x="214" y="226" width="140" height="52" rx="12"/><text class="cp-h" x="284" y="258" text-anchor="middle">TransUnion file</text>
<path id="cp-a1" class="cp-ln" d="M158 160 C 185 140, 190 100, 214 98"/>
<path id="cp-a2" class="cp-ln" d="M158 175 L 214 175"/>
<path id="cp-a3" class="cp-ln" d="M158 190 C 185 210, 190 250, 214 252"/>
<path id="cp-b1" class="cp-ln" d="M354 98 C 378 90, 384 82, 398 82"/>
<path id="cp-b2" class="cp-ln" d="M354 175 C 378 160, 384 146, 398 146"/>
<path id="cp-b3" class="cp-ln" d="M354 252 C 378 230, 384 210, 398 210"/>
<path id="cp-b4" class="cp-ln" d="M354 260 C 378 270, 384 274, 398 274"/>
<g class="cp-gt cp-g1"><rect class="cp-chip" x="398" y="60" width="226" height="46" rx="12"/><text class="cp-c" x="410" y="88">Free app: Vantage</text><text class="cp-n" x="612" y="90" text-anchor="end">742</text></g>
<g class="cp-gt cp-g2"><rect class="cp-chip" x="398" y="124" width="226" height="46" rx="12"/><text class="cp-c" x="410" y="152">Card issuer: FICO 8</text><text class="cp-n" x="612" y="154" text-anchor="end">731</text></g>
<g class="cp-gt cp-g3"><rect class="cp-chipm" x="398" y="188" width="226" height="46" rx="12"/><text class="cp-c" x="410" y="216">Mortgage: Classic FICO</text><text class="cp-nm" x="612" y="218" text-anchor="end">704</text></g>
<g class="cp-gt cp-g4"><rect class="cp-chip" x="398" y="252" width="226" height="46" rx="12"/><text class="cp-c" x="410" y="280">Car loan: FICO Auto*</text><text class="cp-n" x="612" y="282" text-anchor="end">768</text></g>
<text class="cp-s" x="24" y="330">Illustrative scores for one person on the same day. *Industry scores run from 250 to 900.</text>
<circle class="cp-dot" r="6"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#cp-a1"/></animateMotion></circle>
<circle class="cp-dot" r="6"><animateMotion dur="2.6s" begin=".5s" repeatCount="indefinite"><mpath href="#cp-a2"/></animateMotion></circle>
<circle class="cp-dot" r="6"><animateMotion dur="2.6s" begin="1s" repeatCount="indefinite"><mpath href="#cp-a3"/></animateMotion></circle>
<circle class="cp-dot2" r="5"><animateMotion dur="2.2s" begin=".3s" repeatCount="indefinite"><mpath href="#cp-b1"/></animateMotion></circle>
<circle class="cp-dot2" r="5"><animateMotion dur="2.2s" begin=".8s" repeatCount="indefinite"><mpath href="#cp-b2"/></animateMotion></circle>
<circle class="cp-dot2" r="5"><animateMotion dur="2.2s" begin="1.3s" repeatCount="indefinite"><mpath href="#cp-b3"/></animateMotion></circle>
<circle class="cp-dot2" r="5"><animateMotion dur="2.2s" begin="1.8s" repeatCount="indefinite"><mpath href="#cp-b4"/></animateMotion></circle>
</svg>
<figcaption style="font:500 13.5px/1.5 system-ui,sans-serif;color:#5d6271;margin-top:8px">Each bureau holds its own file, and each scoring model reads a file differently. US mortgage lenders pull all three files and use the middle of three Classic FICO scores.</figcaption>
</figure>
