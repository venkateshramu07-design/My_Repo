<figure class="bd-pmove" aria-label="What usually happens to three kinds of retirement savings when you move abroad">
<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Your retirement savings when you move abroad</title>
<style>
.bd-pmove{margin:2em 0!important}
.bd-pmove svg{display:block;width:100%;height:auto;border-radius:20px}
.pmv-bg{fill:#f1f8f5}
.pmv-card{fill:#fff;stroke-width:2}
.pmv-a{stroke:#2f7de1}.pmv-b{stroke:#0f9d76}.pmv-c{stroke:#e2462c}
.pmv-t{font:700 17px Georgia,serif;fill:#15171d}
.pmv-h{font:700 15px system-ui,-apple-system,sans-serif;fill:#15171d}
.pmv-s{font:500 13px system-ui,-apple-system,sans-serif;fill:#5d6271}
.pmv-ok{font:700 13px system-ui,-apple-system,sans-serif;fill:#0b7c5c}
.pmv-w{font:700 13px system-ui,-apple-system,sans-serif;fill:#c23a22}
.pmv-i1{fill:#2f7de1}.pmv-i2{fill:#0f9d76}.pmv-i3{fill:#e2462c}
.pmv-row{opacity:0;transform:translateX(-14px);animation:pmv-in .7s ease-out forwards}
.pmv-r2{animation-delay:.5s}.pmv-r3{animation-delay:1s}
.pmv-plane{animation:pmv-fly 6s ease-in-out infinite}
@keyframes pmv-in{to{opacity:1;transform:none}}
@keyframes pmv-fly{0%{transform:translate(0,0)}50%{transform:translate(70px,-6px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.pmv-row{animation:none;opacity:1;transform:none}.pmv-plane{animation:none}}
</style>
<rect class="pmv-bg" width="640" height="380" rx="20"/>
<text class="pmv-t" x="24" y="38">Moving abroad: what happens to your savings</text>
<g class="pmv-plane"><path d="M520 30 l26 8 -26 8 4 -8z" fill="#7a5af5"/></g>
<g class="pmv-row"><rect class="pmv-card pmv-a" x="20" y="62" width="600" height="92" rx="14"/>
<circle class="pmv-i1" cx="50" cy="94" r="12"/><text x="50" y="99" text-anchor="middle" style="font:800 13px system-ui;fill:#fff">1</text>
<text class="pmv-h" x="74" y="92">State pension (e.g. Social Security, UK State Pension)</text>
<text class="pmv-ok" x="74" y="116">Usually: you keep it and can be paid abroad</text>
<text class="pmv-w" x="74" y="138">Watch: minimum years, agreements, UK freeze</text></g>
<g class="pmv-row pmv-r2"><rect class="pmv-card pmv-b" x="20" y="166" width="600" height="92" rx="14"/>
<circle class="pmv-i2" cx="50" cy="198" r="12"/><text x="50" y="203" text-anchor="middle" style="font:800 13px system-ui;fill:#fff">2</text>
<text class="pmv-h" x="74" y="196">Workplace and personal pensions (401(k), super)</text>
<text class="pmv-ok" x="74" y="220">Usually: leave it invested, draw it later</text>
<text class="pmv-w" x="74" y="242">Watch: early cash-out tax, transfer charges, scams</text></g>
<g class="pmv-row pmv-r3"><rect class="pmv-card pmv-c" x="20" y="270" width="600" height="92" rx="14"/>
<circle class="pmv-i3" cx="50" cy="302" r="12"/><text x="50" y="307" text-anchor="middle" style="font:800 13px system-ui;fill:#fff">3</text>
<text class="pmv-h" x="74" y="300">Tax-free accounts (ISA, Roth IRA, TFSA)</text>
<text class="pmv-ok" x="74" y="324">Usually: you can keep the account open</text>
<text class="pmv-w" x="74" y="346">Watch: may be taxable in your new country</text></g>
</svg>
<figcaption style="font:500 13.5px/1.5 system-ui,sans-serif;color:#5d6271;margin-top:8px">The general pattern in most countries. The exact rules depend on the two countries involved, your citizenship and the type of account.</figcaption>
</figure>
