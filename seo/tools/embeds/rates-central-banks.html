<figure class="bd-cbrates" aria-label="Policy interest rates of four major central banks in October 2026">
<style>
.bd-cbrates{margin:2em 0!important;padding:20px;border-radius:20px;background:#f3f6fb;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.bd-cbrates .cb-h{margin:0 0 4px;font:800 19px Georgia,serif;color:#15171d!important}
.bd-cbrates .cb-s{margin:0 0 16px;font-size:13.5px;color:#5d6271!important}
.bd-cbrates .cb-row{display:grid;grid-template-columns:170px 1fr 64px;gap:12px;align-items:center;margin:12px 0}
.bd-cbrates .cb-row b{font-size:14px;color:#15171d!important}
.bd-cbrates .cb-row small{display:block;font-size:11.5px;color:#5d6271!important;font-weight:500}
.bd-cbrates .cb-track{height:18px;border-radius:999px;background:rgba(0,0,0,.07)!important;overflow:hidden;position:relative}
.bd-cbrates .cb-fill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;width:0;background:#2f7de1!important;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bd-cbrates .cb-up .cb-fill{background:#e2462c!important}
.bd-cbrates.cb-on .cb-fill{width:var(--w)}
.bd-cbrates .cb-v{font:700 14px system-ui,sans-serif;color:#15171d!important;text-align:right}
.bd-cbrates .cb-key{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:#3c404b!important}
.bd-cbrates .cb-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bd-cbrates figcaption{margin-top:12px;font-size:12.5px;color:#5d6271!important}
@media (max-width:560px){.bd-cbrates .cb-row{grid-template-columns:1fr 64px;gap:6px 10px;margin:14px 0}.bd-cbrates .cb-row>span:first-child{grid-column:1/-1}.bd-cbrates .cb-row small{display:inline;margin-left:6px}}
@media (prefers-reduced-motion:reduce){.bd-cbrates .cb-fill{transition:none}}
</style>
<p class="cb-h">Central banks are tightening again</p>
<p class="cb-s">Main policy interest rates, October 2026. Bar length is the rate; red means raised in September or October 2026.</p>
<div class="cb-row cb-up"><span><b>Reserve Bank of India</b><small>repo rate, raised 7 Oct</small></span><span class="cb-track"><i class="cb-fill" style="--w:92%"></i></span><span class="cb-v">5.50%</span></div>
<div class="cb-row cb-up"><span><b>US Federal Reserve</b><small>upper end of range, raised 16 Sep</small></span><span class="cb-track"><i class="cb-fill" style="--w:67%"></i></span><span class="cb-v">4.00%</span></div>
<div class="cb-row"><span><b>Bank of England</b><small>Bank Rate, held 17 Sep (6–3 vote)</small></span><span class="cb-track"><i class="cb-fill" style="--w:62%"></i></span><span class="cb-v">3.75%</span></div>
<div class="cb-row cb-up"><span><b>European Central Bank</b><small>deposit rate, raised 10 Sep</small></span><span class="cb-track"><i class="cb-fill" style="--w:42%"></i></span><span class="cb-v">2.50%</span></div>
<div class="cb-key"><span><i style="background:#e2462c"></i>Raised this autumn</span><span><i style="background:#2f7de1"></i>Held</span></div>
<figcaption>Sources: Federal Reserve, European Central Bank, Bank of England and Reserve Bank of India announcements. Rates are not directly comparable across countries, because inflation and growth differ; what matters for borrowers and savers is the direction.</figcaption>
<script>
(function(){var f=document.currentScript&&document.currentScript.closest('.bd-cbrates');if(!f)return;
if(!('IntersectionObserver' in window)){f.classList.add('cb-on');return;}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){f.classList.add('cb-on');io.disconnect();}})},{threshold:.3});io.observe(f);})();
</script>
</figure>
