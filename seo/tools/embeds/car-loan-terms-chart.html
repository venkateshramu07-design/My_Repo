<figure class="bd-carlt" aria-label="Monthly payment and total interest on a $40,000 car loan at 7% over different terms">
<style>
.bd-carlt{margin:2em 0!important;padding:20px;border-radius:20px;background:#fbf6ee;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.bd-carlt .cl-h{margin:0 0 4px;font:800 19px Georgia,serif;color:#15171d!important}
.bd-carlt .cl-s{margin:0 0 16px;font-size:13.5px;color:#5d6271!important}
.bd-carlt .cl-row{display:grid;grid-template-columns:120px 1fr 1fr;gap:12px;align-items:center;margin:12px 0}
.bd-carlt .cl-row b{font-size:14px;color:#15171d!important}
.bd-carlt .cl-cell{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center}
.bd-carlt .cl-track{height:16px;border-radius:999px;background:rgba(0,0,0,.07)!important;overflow:hidden;position:relative}
.bd-carlt .cl-fill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;width:0;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bd-carlt .cl-pay{background:#2f7de1!important}
.bd-carlt .cl-int{background:#e2462c!important}
.bd-carlt.cl-on .cl-fill{width:var(--w)}
.bd-carlt .cl-v{font:700 13.5px system-ui,sans-serif;color:#15171d!important;text-align:right}
.bd-carlt .cl-head{font:700 12px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5d6271!important}
.bd-carlt figcaption{margin-top:12px;font-size:12.5px;color:#5d6271!important}
@media (max-width:560px){.bd-carlt .cl-row{grid-template-columns:1fr;gap:6px;margin:16px 0}.bd-carlt .cl-headrow{display:none}}
@media (prefers-reduced-motion:reduce){.bd-carlt .cl-fill{transition:none}}
</style>
<p class="cl-h">Longer loans: smaller payments, bigger bills</p>
<p class="cl-s">A $40,000 car loan at 7% interest.</p>
<div class="cl-row cl-headrow"><span class="cl-head">Term</span><span class="cl-head">Monthly payment</span><span class="cl-head">Total interest paid</span></div>
<div class="cl-row"><span><b>36 months</b></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-pay" style="--w:100%"></i></span><span class="cl-v">$1,235</span></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-int" style="--w:42%"></i></span><span class="cl-v">$4,463</span></span></div>
<div class="cl-row"><span><b>48 months</b></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-pay" style="--w:78%"></i></span><span class="cl-v">$958</span></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-int" style="--w:56%"></i></span><span class="cl-v">$5,977</span></span></div>
<div class="cl-row"><span><b>60 months</b></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-pay" style="--w:64%"></i></span><span class="cl-v">$792</span></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-int" style="--w:70%"></i></span><span class="cl-v">$7,523</span></span></div>
<div class="cl-row"><span><b>72 months</b></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-pay" style="--w:55%"></i></span><span class="cl-v">$682</span></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-int" style="--w:85%"></i></span><span class="cl-v">$9,101</span></span></div>
<div class="cl-row"><span><b>84 months</b></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-pay" style="--w:49%"></i></span><span class="cl-v">$604</span></span><span class="cl-cell"><span class="cl-track"><i class="cl-fill cl-int" style="--w:100%"></i></span><span class="cl-v">$10,711</span></span></div>
<figcaption>Stretching the same loan from three years to seven cuts the payment by half but more than doubles the interest, and leaves you owing more than the car is worth for much longer. A record 23.9% of US new-car loans in mid-2026 ran 84 months or more, according to Edmunds.</figcaption>
<script>
(function(){var f=document.currentScript&&document.currentScript.closest('.bd-carlt');if(!f)return;
if(!('IntersectionObserver' in window)){f.classList.add('cl-on');return;}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){f.classList.add('cl-on');io.disconnect();}})},{threshold:.3});io.observe(f);})();
</script>
</figure>
