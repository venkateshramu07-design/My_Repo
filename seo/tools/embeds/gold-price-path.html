<figure class="bd-goldp" aria-label="Gold price from the end of 2024 to October 2026: a surge to a record in January 2026, then a fall of about 28%">
<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gold's surge and fall, in US dollars per ounce</title>
<style>
.bd-goldp{margin:2em 0!important}
.bd-goldp svg{display:block;width:100%;height:auto;border-radius:20px}
.gp-bg{fill:#fbf6ee}
.gp-grid{stroke:#e8e2d6;stroke-width:1}
.gp-ax{font:600 12px system-ui,-apple-system,sans-serif;fill:#5d6271}
.gp-line{fill:none;stroke:#d4a017;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:gp-draw 2.4s ease-out forwards}
.gp-area{fill:#f2a33a;opacity:.12}
.gp-dot{fill:#d4a017;stroke:#fff;stroke-width:2}
.gp-pk{fill:#e2462c;stroke:#fff;stroke-width:2}
.gp-lab{font:800 14px system-ui,-apple-system,sans-serif;fill:#15171d}
.gp-sub{font:500 12px system-ui,-apple-system,sans-serif;fill:#5d6271}
.gp-t{font:700 16px Georgia,serif;fill:#15171d}
@keyframes gp-draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.gp-line{animation:none;stroke-dashoffset:0}}
</style>
<rect class="gp-bg" width="640" height="320" rx="20"/>
<text class="gp-t" x="30" y="34">Gold: a record surge, then a sharp fall</text>
<line class="gp-grid" x1="60" y1="260" x2="610" y2="260"/>
<line class="gp-grid" x1="60" y1="200" x2="610" y2="200"/>
<line class="gp-grid" x1="60" y1="140" x2="610" y2="140"/>
<line class="gp-grid" x1="60" y1="80" x2="610" y2="80"/>
<text class="gp-ax" x="52" y="264" text-anchor="end">$2,000</text>
<text class="gp-ax" x="52" y="204" text-anchor="end">$3,000</text>
<text class="gp-ax" x="52" y="144" text-anchor="end">$4,000</text>
<text class="gp-ax" x="52" y="84" text-anchor="end">$5,000</text>
<path class="gp-area" d="M80 222 L 330 122 L 380 44 L 590 138 L 590 260 L 80 260 Z"/>
<path class="gp-line" d="M80 222 L 330 122 L 380 44 L 590 138"/>
<circle class="gp-dot" cx="80" cy="222" r="6"/>
<circle class="gp-dot" cx="330" cy="122" r="6"/>
<circle class="gp-pk" cx="380" cy="44" r="7"/>
<circle class="gp-dot" cx="590" cy="138" r="6"/>
<text class="gp-lab" x="80" y="210" text-anchor="middle">$2,625</text>
<text class="gp-sub" x="80" y="282" text-anchor="middle">End 2024</text>
<text class="gp-lab" x="318" y="112" text-anchor="end">≈$4,300</text>
<text class="gp-sub" x="330" y="282" text-anchor="middle">End 2025 (+64%)</text>
<text class="gp-lab" x="395" y="50">≈$5,595 record</text>
<text class="gp-sub" x="395" y="68">29 January 2026</text>
<text class="gp-lab" x="585" y="124" text-anchor="end">$4,027</text>
<text class="gp-sub" x="590" y="282" text-anchor="middle">23 Oct 2026 (−28%)</text>
</svg>
<figcaption style="font:500 13.5px/1.5 system-ui,sans-serif;color:#5d6271;margin-top:8px">Approximate spot prices at the points shown; the line joins them and does not show the movements in between. 2025 was gold's best year since 1979. Sources: market data reported by Business Standard, Engineering News and The Trading Tools.</figcaption>
</figure>
