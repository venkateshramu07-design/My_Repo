<figure class="bd-gapst" aria-label="A three-part answer to explain a layoff or career gap in under a minute: the fact, the bridge and the forward turn">
<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The three-part answer: fact, bridge, forward</title>
<style>
.bd-gapst{margin:2em 0!important}
.bd-gapst svg{display:block;width:100%;height:auto;border-radius:20px}
.ga-bg{fill:#f3f5fb}
.ga-c{fill:#fff;stroke-width:2.5}
.ga-1{stroke:#7a5af5}.ga-2{stroke:#2f7de1}.ga-3{stroke:#0f9d76}
.ga-t{font:700 17px Georgia,serif;fill:#15171d}
.ga-n{font:800 28px system-ui,-apple-system,sans-serif}
.ga-h{font:700 15px system-ui,-apple-system,sans-serif;fill:#15171d}
.ga-s{font:500 12.5px system-ui,-apple-system,sans-serif;fill:#5d6271}
.ga-q{font:italic 500 12.5px Georgia,serif;fill:#3d4252}
.ga-track{fill:#e3e7f2}
.ga-fill{fill:#0f9d76;transform-box:fill-box;transform-origin:left;animation:ga-time 9s linear infinite}
.ga-card{opacity:.35;animation:ga-hi 9s linear infinite}
.ga-k2{animation-delay:3s}.ga-k3{animation-delay:6s}
@keyframes ga-time{0%{transform:scaleX(0)}95%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes ga-hi{0%{opacity:1}30%{opacity:1}33%{opacity:.35}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.ga-fill{animation:none}.ga-card{animation:none;opacity:1}}
</style>
<rect class="ga-bg" width="640" height="330" rx="20"/>
<text class="ga-t" x="24" y="36">Answer in three parts, in under a minute</text>
<g class="ga-card"><rect class="ga-c ga-1" x="20" y="60" width="190" height="190" rx="16"/>
<text class="ga-n" x="40" y="100" fill="#7a5af5">1</text><text class="ga-h" x="40" y="128">The fact</text>
<text class="ga-s" x="40" y="150">What happened, plainly,</text><text class="ga-s" x="40" y="168">with no apology</text>
<text class="ga-q" x="40" y="200">"My role was one of</text><text class="ga-q" x="40" y="218">200 cut in March."</text></g>
<g class="ga-card ga-k2"><rect class="ga-c ga-2" x="225" y="60" width="190" height="190" rx="16"/>
<text class="ga-n" x="245" y="100" fill="#2f7de1">2</text><text class="ga-h" x="245" y="128">The bridge</text>
<text class="ga-s" x="245" y="150">What you did or learned</text><text class="ga-s" x="245" y="168">with the time</text>
<text class="ga-q" x="245" y="200">"Since then I finished</text><text class="ga-q" x="245" y="218">a PMP certificate."</text></g>
<g class="ga-card ga-k3"><rect class="ga-c ga-3" x="430" y="60" width="190" height="190" rx="16"/>
<text class="ga-n" x="450" y="100" fill="#0f9d76">3</text><text class="ga-h" x="450" y="128">The forward turn</text>
<text class="ga-s" x="450" y="150">Why you are ready, and</text><text class="ga-s" x="450" y="168">why this role</text>
<text class="ga-q" x="450" y="200">"That's why this role</text><text class="ga-q" x="450" y="218">fits so well..."</text></g>
<rect class="ga-track" x="20" y="272" width="600" height="14" rx="7"/>
<rect class="ga-fill" x="20" y="272" width="600" height="14" rx="7"/>
<text class="ga-s" x="20" y="310">0 seconds</text><text class="ga-s" x="620" y="310" text-anchor="end">about 45 to 60 seconds, then stop</text>
</svg>
<figcaption style="font:500 13.5px/1.5 system-ui,sans-serif;color:#5d6271;margin-top:8px">The same structure works for a layoff, a firing, a career break, study, illness or relocation. Keep each part to one or two sentences.</figcaption>
</figure>
